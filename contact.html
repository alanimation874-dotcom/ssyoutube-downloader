<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - SSYouTube</title>
  <meta name="description" content="Get in touch with the SSYouTube support and developer team.">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .page-container { max-width: 820px; margin: 40px auto; padding: 0 20px; }
    .page-title { font-size: 28px; font-weight: 800; color: #0f2744; margin-bottom: 20px; }
    .page-content p { font-size: 14.5px; color: #3b4d61; line-height: 1.7; margin-bottom: 20px; }
    .contact-form { max-width: 560px; display: flex; flex-direction: column; gap: 16px; }
    .form-group label { display: block; font-size: 13.5px; font-weight: 600; color: #0f2744; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 14px; }
    textarea.form-control { min-height: 120px; resize: vertical; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo"><span class="logo-ss">SS</span><span class="logo-youtube">YouTube</span></a>
      <nav class="nav-links">
        <a href="index.html" class="nav-item">YouTube Downloader</a>
        <a href="youtube-to-mp4.html" class="nav-item">YouTube to MP4</a>
        <a href="youtube-to-mp3.html" class="nav-item">YouTube to MP3</a>
      </nav>
    </div>
  </header>

  <main class="page-container">
    <h1 class="page-title">Contact Us</h1>
    <div class="page-content">
      <p>Have inquiries, feedback, or technical questions? Send us a message and our team will get back to you within 24–48 hours.</p>

      <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent successfully.'); this.reset();">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" class="form-control" placeholder="Describe your question or feedback..." required></textarea>
        </div>
        <button type="submit" class="btn btn-download" style="width: 140px; margin-top: 8px;">Send Message</button>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-links">
        <a href="about.html">About Us</a>
        <a href="terms.html">Terms of Service</a>
        <a href="privacy.html">Privacy Policy</a>
        <a href="contact.html">Contact Us</a>
        <a href="disclaimer.html">Disclaimer</a>
      </div>
      <p class="footer-copyright">&copy; 2026 SSYouTube. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
